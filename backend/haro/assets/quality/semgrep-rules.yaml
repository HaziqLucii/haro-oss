# haro's bundled semgrep starter rules (backlog/double-gate.md §1).
#
# Deliberately SMALL and high-signal. The registry packs (p/security-audit, p/owasp-top-ten)
# are better, but they are fetched over the network on first use, and haro is local-first: a
# quality gate that needs the internet to say anything is not a gate you can rely on. These
# ship with the binary so `[quality] scanners = ["semgrep"]` works offline, out of the box.
#
# Point `[quality] semgrep_config` at a registry pack or your own file to replace them —
# that is the expected path once a project cares enough to tune it. Everything here is a
# pattern with a low false-positive rate, because a noisy quality gate gets switched off and
# then protects nothing (the cry-wolf kill condition).
rules:
  - id: haro-python-eval
    pattern: eval(...)
    message: eval() executes arbitrary code; parse or whitelist the input instead
    languages: [python]
    severity: ERROR

  - id: haro-python-exec
    pattern: exec(...)
    message: exec() executes arbitrary code; restructure so the code path is static
    languages: [python]
    severity: ERROR

  - id: haro-python-shell-true
    patterns:
      - pattern-either:
          - pattern: subprocess.call(..., shell=True, ...)
          - pattern: subprocess.run(..., shell=True, ...)
          - pattern: subprocess.Popen(..., shell=True, ...)
          - pattern: subprocess.check_output(..., shell=True, ...)
    message: shell=True lets argument content become shell syntax; pass a list of args
    languages: [python]
    severity: ERROR

  - id: haro-python-yaml-load
    pattern: yaml.load($X)
    message: yaml.load() without a SafeLoader can construct arbitrary objects; use yaml.safe_load()
    languages: [python]
    severity: ERROR

  - id: haro-js-eval
    pattern: eval(...)
    message: eval() executes arbitrary code; use JSON.parse or an explicit dispatch table
    languages: [javascript, typescript]
    severity: ERROR

  - id: haro-js-new-function
    pattern: new Function(...)
    message: new Function() is eval by another name; build the behaviour explicitly
    languages: [javascript, typescript]
    severity: ERROR

  - id: haro-js-child-process-exec
    patterns:
      - pattern-either:
          - pattern: child_process.exec($CMD, ...)
          - pattern: exec($CMD, ...)
      - pattern-not: child_process.exec("...", ...)
      - pattern-not: exec("...", ...)
    message: exec() with a built string invokes a shell; prefer execFile/spawn with an args array
    languages: [javascript, typescript]
    severity: WARNING

  - id: haro-js-inner-html
    pattern: $EL.innerHTML = $X
    message: assigning innerHTML from a variable is an XSS sink; use textContent or sanitise
    languages: [javascript, typescript]
    severity: WARNING
