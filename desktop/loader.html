<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>haro</title>
    <style>
      /* Kuro dossier splash, shown while Electron polls /health (see main.js's
         waitForHealth — up to 45s on a cold start, so this earns its keep). Kept
         in sync with frontend/index.html's #boot block by hand: same markup,
         same CSS, so the swap to the live SPA is pixel-identical and invisible.
         No @font-face here (deliberately, unlike index.html): electron-builder's
         `files` list packages only main.js/preload.js/loader.html/assets, not
         frontend/public/fonts, so a relative woff2 URL would 404 in a packaged
         build. This splash is on screen only a moment; system serif/mono cover
         it close enough, and the live SPA carries the real Fraunces/Space Mono. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0a09;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0a09;
      }
      #boot-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        transform: translateY(-4vh);
      }
      .boot-mark {
        font-family: Georgia, "Times New Roman", serif;
        font-weight: 600;
        font-size: 56px;
        letter-spacing: -0.01em;
        color: rgb(205 196 186);
        opacity: 0;
        animation: boot-resolve 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .boot-period {
        opacity: 0;
        animation: boot-resolve 600ms cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
      }
      .boot-rule {
        width: 220px;
        height: 1px;
        background: rgba(205, 196, 186, 0.2);
        transform: scaleX(0);
        transform-origin: left;
        animation: boot-rule-draw 600ms cubic-bezier(0.16, 1, 0.3, 1) 200ms forwards;
      }
      .boot-rows {
        display: flex;
        flex-direction: column;
        width: 220px;
      }
      .boot-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-top: 1px solid rgba(205, 196, 186, 0.1);
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 0.08em;
        opacity: 0;
      }
      .boot-row:first-child {
        border-top: none;
      }
      .boot-row[data-key="backend"] {
        animation: boot-resolve 600ms cubic-bezier(0.16, 1, 0.3, 1) 260ms forwards;
      }
      .boot-row[data-key="workspaces"] {
        animation: boot-resolve 600ms cubic-bezier(0.16, 1, 0.3, 1) 320ms forwards;
      }
      .boot-row[data-key="feed"] {
        animation: boot-resolve 600ms cubic-bezier(0.16, 1, 0.3, 1) 380ms forwards;
      }
      .boot-row .k {
        color: rgba(205, 196, 186, 0.4);
        text-transform: uppercase;
      }
      .boot-row .v {
        color: rgb(205 196 186);
        font-variant-numeric: tabular-nums;
        text-align: right;
        opacity: 0.4;
        animation: boot-breathe 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes boot-resolve {
        from {
          opacity: 0.1;
          transform: translateY(2px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-rule-draw {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      @keyframes boot-breathe {
        0%,
        100% {
          opacity: 0.4;
        }
        50% {
          opacity: 0.85;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        #boot * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div id="boot-stack">
        <div class="boot-mark">haro<span class="boot-period">.</span></div>
        <div class="boot-rule"></div>
        <div class="boot-rows">
          <div class="boot-row" data-key="backend">
            <span class="k">backend</span><span class="v">starting···</span>
          </div>
          <div class="boot-row" data-key="workspaces">
            <span class="k">workspaces</span><span class="v">···</span>
          </div>
          <div class="boot-row" data-key="feed">
            <span class="k">live feed</span><span class="v">···</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
