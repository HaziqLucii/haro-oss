name: ci

# haro's real gate is LOCAL and pre-merge. That is the product's whole thesis: no work is
# mergeable until the suite is green, and you watch it happen. So this workflow is not the
# gate, it is the backstop: it re-runs both suites on anything that reaches main or a PR,
# which catches a push made outside haro (a hotfix from another machine, a web edit, a
# teammate without the app). Treat a red run here as "the local gate was bypassed".
#
# COST NOTE, because this repo is PRIVATE and therefore metered (public repos get
# unlimited standard runners; private repos on the Free plan include 2,000 Linux
# minutes/month). Every choice below keeps a run cheap and makes a runaway bill impossible:
#
#   one workflow per side  This one runs ONLY the backend suite (about two minutes). The
#                        Flutter suite is app-ci.yml: about ten minutes on a 2-core runner,
#                        so it must not run when only the backend changed, and the other
#                        way round.
#   paths                Each workflow runs only when its own folder (or its own workflow
#                        file) changed. A docs, backlog, notes or brand commit costs zero.
#   ubuntu-latest only   Linux bills at 1x. Windows is 2x and macOS is 10x, so a
#                        three-OS matrix would cost 13x for no signal we need: haro is
#                        Linux-first by design.
#   timeout-minutes      THE important one. GitHub's default job timeout is 6 hours, so a
#                        single hung process could eat 18% of the monthly allowance. Ours
#                        die at 10 minutes.
#   concurrency          A rapid second push cancels the superseded run instead of paying
#                        for both.
#   dependency caching   pip resolves from cache instead of the network.
#   no artifact uploads  Artifact/package storage is the one thing that CAN bill on the
#                        Free plan (500 MB included). We upload nothing, so it cannot.
#   no schedule/cron     Nothing burns minutes while you sleep.
#
# You also cannot be charged by accident: a GitHub account's Actions spending limit
# defaults to $0, which means running out of included minutes BLOCKS further runs rather
# than billing you. Worth confirming once at
# https://github.com/settings/billing (Spending limits), and leaving at $0.
#
# CAVEAT on paths: if you later turn on branch protection with a REQUIRED status check, a
# PR that does not touch backend/ will never produce that check and will sit blocked
# forever. (Branch protection is not available on the Free plan for private repos anyway.)
#
# ACTION VERSIONS: pinned to majors whose own runtime is node24 (checkout@v7,
# setup-python@v7, setup-node@v7). GitHub deprecated node20 for action runtimes, and a
# node20 action emits an annotation on every run. Dependabot (.github/dependabot.yml,
# github-actions ecosystem, monthly) keeps these current from here.

on:
  # publish-oss.sh starts this after each force-push: a squashed snapshot shares no history
  # with the previous one, so path filters can't diff it and the push event runs nothing.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"

# One live run per branch. github.ref is the branch for a push and the PR ref for a PR,
# so a push and its PR do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo, comments, or publishes.
permissions:
  contents: read

jobs:
  backend:
    name: backend · pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Matches the version ./run.sh's venv is built against, so CI and the real
          # runtime cannot drift. pyproject allows >=3.11 if you ever want a matrix,
          # but that multiplies the minutes, so pin the one version we actually ship on.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        # requirements.txt is the honest install surface: it is exactly what
        # run.sh's venv installs, so a green CI proves the shipped app can boot.
        # (The suite needs no database: db.py uses aiosqlite, and the tests construct
        # store/models in memory.)
        run: pip install -r requirements.txt

      - name: Run the gate (pytest)
        # No PYTHONPATH needed: pyproject sets `pythonpath = ["."]`, which is how the
        # `haro` package imports without being installed.
        run: python -m pytest -q
